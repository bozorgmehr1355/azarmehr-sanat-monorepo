/* ═══════════════════════════════════════ TOAST ════════════════════════════════════════ */
function Toast({ toast, onDone }) {
  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => onDone(), 3500);
    return () => clearTimeout(t);
  }, [toast]);
  if (!toast) return null;
  const bg = toast.type === 'success' ? C.success : C.danger;
  return (
    <div style={{ position:"fixed", bottom:80, left:"50%", transform:"translateX(-50%)", background:bg, color:"#fff", padding:"10px 20px", borderRadius:10, zIndex:9999, fontSize:13, fontWeight:600, fontFamily:FF, boxShadow:"0 4px 16px #00000066", animation:"toastIn 0.3s ease" }}>
      {toast.msg}
    </div>
  );
}

/* ═══════════════════════════════════════ ORDER DETAIL BOTTOM SHEET ════════════════════ */
function OrderDetailSheet({ order, onClose, onSupport }) {
  const [items, setItems] = useState([]);
  const [statusLog, setStatusLog] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (!order) return;
    setLoading(true);

    // Fetch items + status log in parallel
    const fetchAll = async () => {
      try {
        const [itemsData, logData] = await Promise.all([
          apiCall(`/crm-order-items?order_id=eq.${order.id}`).catch(() => []),
          apiCall(`/crm-order-status-log?order_id=${order.id}`).catch(() => []),
        ]);
        setItems(itemsData||[]);
        setStatusLog(logData||[]);
      } catch (_) {}
      setLoading(false);
    };
    fetchAll();
  }, [order]);

  const statusLabel = STATUS_LABELS[order.order_status] || order.order_status || '—';
  const itemTotal = items.reduce((s, i) => s + (Number(i.total || i.unit_price * i.quantity) || 0), 0);
  const totalAmount = Number(order.total_amount) || itemTotal || 0;

  if (!order) return null;

  const sheetS = { width:"100%", background:C.surface, borderRadius:"16px 16px 0 0", maxHeight:"85vh", display:"flex", flexDirection:"column", overflow:"hidden" };

  return (
    <div style={{ position:"fixed", inset:0, background:"#000000aa", zIndex:2000, display:"flex", alignItems:"flex-end" }} onClick={onClose}>
      <div style={sheetS} onClick={e => e.stopPropagation()}>
        {/* Handle */}
        <div style={{ width:40, height:4, background:C.borderLight, borderRadius:2, margin:"10px auto 4px" }} />

        <div style={{ padding:"8px 20px 20px", overflowY:"auto", flex:1 }}>
          {/* Header */}
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
            <h3 style={{ fontSize:16, fontWeight:700, color:C.text }}>جزئیات سفارش #{fa(order.id)}</h3>
            <button onClick={onClose} style={{ background:"none", border:"none", color:C.textDim, cursor:"pointer", padding:"4px 8px", display:"flex", alignItems:"center" }}><Icon name="close" size={16} /></button>
          </div>

          {/* Status badge */}
          <div style={{ marginBottom:14 }}>
            <span style={{ fontSize:12, padding:"4px 10px", borderRadius:6, background:C.surfaceAlt, color:C.textMuted, fontWeight:600 }}>{statusLabel}</span>
            {order.proforma_status === 'issued' && <span style={{ fontSize:11, padding:"4px 8px", borderRadius:5, background:C.purpleDim, color:C.purple, fontWeight:600, marginRight:6 }}>پیش‌فاکتور صادر شده</span>}
            {order.proforma_status === 'approved' && <span style={{ fontSize:11, padding:"4px 8px", borderRadius:5, background:C.successDim, color:C.success, fontWeight:600, marginRight:6 }}>✓ پیش‌فاکتور تایید شده</span>}
          </div>

          {/* Info fields */}
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:16 }}>
            <div style={{ background:C.surfaceAlt, borderRadius:8, padding:"10px 12px" }}>
              <p style={{ fontSize:10, color:C.textDim, marginBottom:2, fontWeight:600 }}>شماره سفارش</p>
              <p style={{ fontSize:14, fontWeight:700, color:C.text, direction:"ltr", textAlign:"left" }}>#{fa(order.id)}</p>
            </div>
            <div style={{ background:C.surfaceAlt, borderRadius:8, padding:"10px 12px" }}>
              <p style={{ fontSize:10, color:C.textDim, marginBottom:2, fontWeight:600 }}>تاریخ ثبت</p>
              <p style={{ fontSize:13, fontWeight:600, color:C.text }}>{formatDate(order.created_at)}</p>
            </div>
            {order.payment_status && (
              <div style={{ background:C.surfaceAlt, borderRadius:8, padding:"10px 12px" }}>
                <p style={{ fontSize:10, color:C.textDim, marginBottom:2, fontWeight:600 }}>وضعیت پرداخت</p>
                <p style={{ fontSize:13, fontWeight:600, color:C.text }}>{order.payment_status === 'paid' ? 'پرداخت شده' : order.payment_status === 'pending' ? 'در انتظار پرداخت' : order.payment_status}</p>
              </div>
            )}
            <div style={{ background:C.surfaceAlt, borderRadius:8, padding:"10px 12px" }}>
              <p style={{ fontSize:10, color:C.textDim, marginBottom:2, fontWeight:600 }}>مبلغ کل</p>
              <p style={{ fontSize:14, fontWeight:700, color:C.primary, direction:"ltr", textAlign:"left" }}>{shortCur(totalAmount)}</p>
            </div>
          </div>

          {/* Items */}
          <div style={{ marginBottom:16 }}>
            <h4 style={{ fontSize:13, fontWeight:700, color:C.text, marginBottom:8 }}>اقلام سفارش</h4>
            {loading ? (
              <p style={{ fontSize:12, color:C.textDim, textAlign:"center", padding:12 }}>در حال بارگذاری...</p>
            ) : items.length === 0 ? (
              order.note ? <p style={{ fontSize:12, color:C.textDim, padding:8, background:C.surfaceAlt, borderRadius:8, lineHeight:1.7 }}>{order.note}</p>
                        : <p style={{ fontSize:12, color:C.textDim, padding:8, textAlign:"center" }}>اطلاعات اقلام موجود نیست</p>
            ) : (
              <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                {items.map((item, idx) => {
                  const qty = Number(item.quantity) || 0;
                  const unitPrice = Number(item.unit_price) || 0;
                  const lineTotal = Number(item.total || (qty * unitPrice)) || 0;
                  const productName = item.products ? (item.products.name || item.item_name) : (item.item_name || `محصول #${item.product_id}`);
                  return (
                    <div key={item.id || idx} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"8px 10px", background:C.surfaceAlt, borderRadius:8 }}>
                      <div style={{ flex:1, marginLeft:8 }}>
                        <p style={{ fontSize:12, fontWeight:600, color:C.text }}>{productName}</p>
                        <p style={{ fontSize:10, color:C.textDim }}>{fa(qty)} × {shortCur(unitPrice)}</p>
                      </div>
                      <span style={{ fontSize:12, fontWeight:700, color:C.primary, whiteSpace:"nowrap" }}>{shortCur(lineTotal)}</span>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* Status history */}
          {statusLog.length > 0 && (
            <div style={{ marginBottom:"70px" }}>
              <h4 style={{ fontSize:13, fontWeight:700, color:C.text, marginBottom:8 }}>تاریخچه وضعیت</h4>
              <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
                {statusLog.map((log, idx) => (
                  <div key={log.id || idx} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"6px 8px", background:C.surfaceAlt, borderRadius:6 }}>
                    <div>
                      <p style={{ fontSize:11, fontWeight:600, color:C.text }}>{STATUS_LABELS[log.to_status] || log.to_status}</p>
                      {log.from_status && <p style={{ fontSize:10, color:C.textDim }}>از: {STATUS_LABELS[log.from_status] || log.from_status}</p>}
                    </div>
                    <span style={{ fontSize:10, color:C.textDim }}>{formatDate(log.created_at)}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Action buttons */}
          <div style={{ position:"sticky", bottom:0, background:C.surface, padding:"12px 0 8px", display:"flex", gap:8 }}>
            <button onClick={() => { if (onSupport) { onSupport(order.id); onClose(); } }} style={{ flex:1, padding:"11px", borderRadius:8, border:"none", background:C.info, color:"#fff", fontWeight:600, cursor:"pointer", fontFamily:FF, fontSize:12 }}>
              پیگیری این سفارش
            </button>
            <button onClick={onClose} style={{ padding:"11px 16px", borderRadius:8, border:`1px solid ${C.border}`, background:"transparent", color:C.textDim, fontWeight:600, cursor:"pointer", fontFamily:FF, fontSize:12 }}>
              بستن
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════ SUPPORT TICKET FORM ═══════════════════════════ */
const ORDER_CATEGORIES = [
  { id:'order_tracking',  label:'پیگیری سفارش' },
  { id:'order_question', label:'سوال ثبت سفارش' },
  { id:'warranty',       label:'گارانتی/مرجوعی' },
  { id:'payment',        label:'مشکل پرداخت' },
  { id:'other',          label:'سایر' },
];

function SupportTicketForm({ onClose, prefillOrderId }) {
  const [subject, setSubject] = useState('');
  const [category, setCategory] = useState('order_tracking');
  const [orderId, setOrderId] = useState(prefillOrderId || '');
  const [message, setMessage] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [success, setSuccess] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError('');
    if (!subject.trim()) { setError('موضوع را وارد کنید'); return; }
    if (!message.trim()) { setError('متن پیام را وارد کنید'); return; }
    setLoading(true);
    try {
      const res = await apiCall('/support-tickets', {
        method: 'POST',
        body: JSON.stringify({
          subject: subject.trim(),
          category,
          order_id: orderId ? Number(orderId) : undefined,
          message: message.trim(),
        }),
      });
      if (res && res.ok) {
        setSuccess(true);
      } else {
        throw new Error(res?.error || 'خطا');
      }
    } catch (e) {
      const msg = e.message || '';
      if (msg.includes('راه‌اندازی') || msg.includes('fallback')) {
        setError('سامانه پشتیبانی در حال راه‌اندازی است. لطفاً بعداً تلاش کنید یا با پشتیبانی تماس بگیرید.');
      } else {
        setError(msg || 'خطا در ثبت درخواست');
      }
    } finally {
      setLoading(false);
    }
  };

  const iS = { width:"100%", padding:"10px 12px", background:C.bg, border:`1px solid ${C.border}`, borderRadius:8, color:C.text, fontSize:13, fontFamily:FF, boxSizing:"border-box" };
  const lblS = { display:"block", fontSize:11, color:C.textMuted, marginBottom:3, fontWeight:600 };

  return (
    <div style={{ position:"fixed", inset:0, background:"#000a", zIndex:2000, display:"flex", alignItems:"center", justifyContent:"center", padding:16 }} onClick={onClose}>
      <div style={{ background:C.surface, borderRadius:16, padding:"20px 20px 24px", width:"100%", maxWidth:480, border:`1px solid ${C.border}`, maxHeight:"90vh", overflowY:"auto" }} onClick={e => e.stopPropagation()}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
          <h3 style={{ fontSize:16, fontWeight:700, color:C.text }}>ثبت درخواست پشتیبانی</h3>
          <button onClick={onClose} style={{ background:"none", border:"none", color:C.textDim, cursor:"pointer", padding:"4px 8px", display:"flex", alignItems:"center" }}><Icon name="close" size={16} /></button>
          </div>

        {success ? (
          <div style={{ textAlign:"center", padding:"30px 0" }}>
            <svg width="48" height="48" fill="none" stroke={C.success} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ marginBottom:12 }}>
              <path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <p style={{ fontSize:15, fontWeight:700, color:C.text, marginBottom:6 }}>درخواست شما ثبت شد</p>
            <p style={{ fontSize:12, color:C.textDim, lineHeight:1.7, marginBottom:16 }}>کارشناسان ما به زودی درخواست شما را بررسی و پیگیری می‌کنند.</p>
            <button onClick={onClose} style={{ padding:"10px 24px", borderRadius:8, border:"none", background:C.primary, color:"#111", fontWeight:700, cursor:"pointer", fontFamily:FF, fontSize:13 }}>باشه</button>
          </div>
        ) : (
          <form onSubmit={handleSubmit}>
            {error && (
              <div style={{ background:C.dangerDim, border:`1px solid ${C.danger}44`, borderRadius:8, padding:"8px 12px", fontSize:12, color:C.danger, marginBottom:12, textAlign:"center" }}>{error}</div>
            )}

            <div style={{ marginBottom:12 }}>
              <label style={lblS}>موضوع *</label>
              <input type="text" value={subject} onChange={e => setSubject(e.target.value)} placeholder="مثال: پیگیری وضعیت سفارش" style={iS} />
            </div>

            <div style={{ marginBottom:12 }}>
              <label style={lblS}>دسته‌بندی</label>
              <select value={category} onChange={e => setCategory(e.target.value)} style={{ ...iS, cursor:"pointer" }}>
                {ORDER_CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
              </select>
            </div>

            <div style={{ marginBottom:12 }}>
              <label style={lblS}>شماره سفارش (اختیاری)</label>
              <input type="number" min="1" value={orderId} onChange={e => setOrderId(e.target.value)} placeholder="در صورت وجود شماره سفارش مرتبط" style={iS} />
            </div>

            <div style={{ marginBottom:18 }}>
              <label style={lblS}>متن پیام *</label>
              <textarea rows={4} value={message} onChange={e => setMessage(e.target.value)} placeholder="توضیحات خود را وارد کنید..." style={{ ...iS, resize:"vertical", lineHeight:1.7, minHeight:80 }} />
            </div>

            <button type="submit" disabled={loading} style={{ width:"100%", padding:"11px", borderRadius:8, border:"none", background:loading ? C.surfaceAlt : C.primary, color:loading ? C.textDim : "#111", fontWeight:700, cursor:loading?"not-allowed":"pointer", fontFamily:FF, fontSize:13, opacity:loading?0.6:1 }}>
              {loading ? "در حال ثبت..." : "ثبت درخواست"}
            </button>
          </form>
        )}
      </div>
    </div>
  );
}
const TABS = [
  { id:'home',     label:'خانه', icon:IcHome },
  { id:'products', label:'محصولات', icon:IcBox },
  { id:'orders',   label:'سفارشات', icon:IcFile },
  { id:'profile',  label:'پروفایل', icon:IcUser },
];

function App() {
  const [tab, setTab] = useState('home');
  const [customer, setCustomer] = useState(null);
  const [orders, setOrders] = useState([]);
  const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState('');
  const [cart, setCart] = useState(null);          // draft object from API
  const [cartItems, setCartItems] = useState([]);   // draft.items
  const [showCart, setShowCart] = useState(false);  // cart panel visibility
  const [showWarrantyForm, setShowWarrantyForm] = useState(false); // warranty form overlay
  const [showSupportForm, setShowSupportForm] = useState(false);   // support ticket form
  const [supportPrefillOrder, setSupportPrefillOrder] = useState(null); // order id to prefill
  const [selectedOrder, setSelectedOrder] = useState(null); // for order detail sheet
  const [submittingCart, setSubmittingCart] = useState(false);
  const [toast, setToast] = useState(null); // { msg, type:'success'|'error' }
  const [deepLinkData, setDeepLinkData] = useState(null);
  const deepLinkProcessed = useRef(false);
  const [authScreen, setAuthScreen] = useState(() => {
    const h = window.location.hash.toLowerCase().replace(/^#\/?/, '');
    if (h === 'warranty' || h === 'warranty-request') return 'warranty';
    return 'select';
  }); // 'select' | 'retail' | 'wholesale' | 'warranty'
  const [initialMobile, setInitialMobile] = useState(() => {
    const p = new URLSearchParams(window.location.search);
    return p.get('mobile') || '';
  });

  // Expose setTab for programmatic navigation (e.g. from ProfileTab)
  useEffect(() => {
    window.TABS_REF = { setTab };
    return () => { delete window.TABS_REF; };
  }, []);

  const loadData = async (token, initialUser, showWelcome) => {
    setLoading(true);
    let welcomeName = '';
    try {
      if (!token) { setError('نشست منقضی شده'); setLoading(false); return; }
      const payload = decodeJwt(token);
      if (!payload || !payload.id) { localStorage.removeItem('az_token'); setError('نشست نامعتبر'); setLoading(false); return; }

      // Set basic profile from login response (has name) or JWT
      const profile = initialUser || {
        id: payload.id,
        username: payload.username,
        name: payload.name || payload.username,
        customer_type: payload.customer_type || 'wholesale',
      };
      welcomeName = profile.name || '';
      setCustomer(profile);

      // Fetch full customer profile for phone, city, email, address, grade
      try {
        const full = await apiCall(`/crm-customers?id=${profile.id}`);
        if (full && full.length > 0) {
          setCustomer(prev => ({ ...prev, ...full[0] }));

          // ── Customer & Lead Sync: customers table + lead conversion ──
          const customerPhone = full[0].phone;
          if (customerPhone) {
            // ── Stage 1: Normalize mobile ──
            const digitsOnly = String(customerPhone).replace(/\D/g, '');
            const mobileClean = digitsOnly.startsWith('98') ? '0' + digitsOnly.slice(2) : digitsOnly;

            const SB = 'https://apscmdspkitpwzhizgkq.supabase.co/rest/v1';
            const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwc2NtZHNwa2l0cHd6aGl6Z2txIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0MDc3NDgsImV4cCI6MjA5Njk4Mzc0OH0.LC_e1vafGe2KtTrWsb0mjIVIrQoqyvA46THD83HkhMo';
            const hdr = { 'Content-Type': 'application/json', 'apikey': SB_KEY };
            let customerId = null;

            // ── Stage 2: Check customer → create if not exists ──
            try {
              const getResp = await fetch(`${SB}/customers?mobile=eq.${encodeURIComponent(mobileClean)}&select=id`, { headers: hdr });
              const existing = await getResp.json();
              if (existing && existing.length > 0) {
                customerId = existing[0].id;
              } else {
                const postResp = await fetch(`${SB}/customers`, {
                  method: 'POST',
                  headers: { ...hdr, 'Prefer': 'return=representation' },
                  body: JSON.stringify({
                    mobile: mobileClean,
                    name: full[0].name || null,
                    source: 'portal',
                  }),
                });
                const created = await postResp.json();
                if (created && created.length > 0) {
                  customerId = created[0].id;
                }
              }
            } catch (e) {
              console.error('[Customer Sync] Failed:', e);
            }

            // ── Stage 3 & 4: Check lead → update status + link customer.lead_id ──
            try {
              const leadResp = await fetch(`${SB}/leads?mobile=eq.${encodeURIComponent(mobileClean)}&select=id`, { headers: hdr });
              const leads = await leadResp.json();
              if (leads && leads.length > 0) {
                const lead = leads[0];

                // Try PATCH with converted_at (column may not exist yet)
                let patchResp = await fetch(`${SB}/leads?id=eq.${lead.id}`, {
                  method: 'PATCH',
                  headers: hdr,
                  body: JSON.stringify({
                    status: 'converted',
                    converted_at: new Date().toISOString(),
                  }),
                });
                // Fallback: if column doesn't exist, retry with just status
                if (!patchResp.ok) {
                  await fetch(`${SB}/leads?id=eq.${lead.id}`, {
                    method: 'PATCH',
                    headers: hdr,
                    body: JSON.stringify({ status: 'converted' }),
                  });
                }

                // Link customer → lead
                if (customerId) {
                  await fetch(`${SB}/customers?id=eq.${customerId}`, {
                    method: 'PATCH',
                    headers: hdr,
                    body: JSON.stringify({ lead_id: lead.id }),
                  });
                }
              }
            } catch (e) {
              console.error('[Lead Conversion] Failed:', e);
            }
          }
        }
      } catch (_) { /* use basic profile */ }

      // Fetch active products for order form
      try {
        const all = await apiCall('/products');
        setProducts((all||[]).filter(p => p.active === true));
      } catch (_) { /* products unavailable */ }

      // ── Load active draft ──────────────────────────────────────────
      try {
      const draftData = await apiCall('/crm-draft-orders/me');
        if (draftData && draftData.draft) {
          setCart(draftData.draft);
          setCartItems(draftData.draft.items || []);
        } else {
          setCart(null);
          setCartItems([]);
        }
      } catch (_) { /* no draft */ }

      const orderData = await apiCall(`/crm-orders?customer_id=${profile.id}`);
      setOrders((orderData||[]).sort((a, b) => new Date(b.created_at) - new Date(a.created_at)));
    } catch (err) {
      console.error(err);
      setError('خطا در بارگذاری اطلاعات');
      if (err.message?.includes('401') || err.message?.includes('توکن')) {
        localStorage.removeItem('az_token');
      }
    } finally {
      if (showWelcome && welcomeName) {
        setToast({ msg: `خوش آمدید، ${welcomeName} 🙌`, type: 'success' });
      }
      setLoading(false);
    }
  };

  useEffect(() => {
    const token = localStorage.getItem('az_token');
    if (token) loadData(token); else setLoading(false);
  }, []);

  // Deep-link: پردازش پارامترهای URL بعد از لود دیتا
  useEffect(() => {
    if (!customer || !products || products.length === 0) return;
    if (deepLinkProcessed.current) return;

    const params = new URLSearchParams(window.location.search);
    const action = params.get('action');

    if (action === 'new-order') {
      const productId = params.get('product_id');
      const qtyStr = params.get('qty');
      const mobileFromUrl = params.get('mobile') || '';

      setDeepLinkData({
        productId: productId ? Number(productId) : null,
        qty: qtyStr ? Math.max(1, Number(qtyStr) || 1) : 1,
        mobile: mobileFromUrl,
      });
      setTab('orders');
      deepLinkProcessed.current = true;

      // پاک کردن پارامترها از URL برای جلوگیری از پردازش مجدد در رفرش
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  }, [customer, products]);

  const handleLogin = (token, userData) => {
    setError('');
    loadData(token, userData, true);
  };

  const logout = () => {
    localStorage.removeItem('az_token');
    setCustomer(null);
    setOrders([]);
    setTab('products');
    setAuthScreen('select');
  };

  const approveProforma = async (orderId) => {
    try {
      const res = await apiCall('/crm-proforma-approve', { method: 'POST', body: JSON.stringify({ order_id: orderId }) });
      if (res && res.ok) {
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, proforma_status: 'approved' } : o));
        alert('پیش‌فاکتور با موفقیت تایید شد');
      }
    } catch (e) {
      alert('خطا در تایید: ' + (e.message || ''));
    }
  };

  /* ── Cart Operations ──────────────────────────────────────────────── */
  const loadCart = async () => {
    try {
      const d = await apiCall('/crm-draft-orders/me');
      if (d && d.draft) { setCart(d.draft); setCartItems(d.draft.items || []); }
      else { setCart(null); setCartItems([]); }
    } catch { setCart(null); setCartItems([]); }
  };

  const addToCart = async (product, qty = 1) => {
    const grade = customer?.grade || 'standard';
    const priceField = GRADE_PRICE_MAP[grade] || 'price_standard';
    const price = Number(product[priceField] || product.base_price || 0);
    if (price <= 0) { setToast({ msg:'این محصول قیمت‌گذاری نشده', type:'error' }); return; }

    // Merge with existing items: if same product_id exists, increase qty
    const existing = cartItems.find(i => Number(i.product_id) === Number(product.id));
    let newItems;
    if (existing) {
      newItems = cartItems.map(i =>
        Number(i.product_id) === Number(product.id)
          ? { ...i, quantity: (i.quantity || 0) + qty }
          : i
      );
    } else {
      newItems = [...cartItems, {
        product_id: product.id,
        item_name: product.name,
        quantity: qty,
        unit_price: price,
        unit: product.unit || product.packaging || '',
      }];
    }

    try {
      const body = JSON.stringify({ items: newItems });
      const result = await apiCall('/crm-draft-orders/me', { method: 'POST', body });
      if (result && result.draft) {
        setCart(result.draft);
        setCartItems(result.draft.items || []);
      }
    } catch (err) {
      setToast({ msg:'خطا: ' + (err.message || ''), type:'error' });
    }
  };

  const updateCartQty = async (productId, newQty) => {
    if (newQty <= 0) { removeFromCart(productId); return; }
    const newItems = cartItems.map(i =>
      Number(i.product_id) === Number(productId) ? { ...i, quantity: newQty } : i
    );
    try {
      const result = await apiCall('/crm-draft-orders/me', { method: 'POST', body: JSON.stringify({ items: newItems }) });
      if (result && result.draft) { setCart(result.draft); setCartItems(result.draft.items || []); }
    } catch (err) { setToast({ msg:'خطا: ' + (err.message || ''), type:'error' }); }
  };

  const removeFromCart = async (productId) => {
    const newItems = cartItems.filter(i => Number(i.product_id) !== Number(productId));
    try {
      if (newItems.length === 0) {
        await apiCall('/crm-draft-orders/me', { method: 'DELETE' });
        setCart(null); setCartItems([]);
      } else {
        const result = await apiCall('/crm-draft-orders/me', { method: 'POST', body: JSON.stringify({ items: newItems }) });
        if (result && result.draft) { setCart(result.draft); setCartItems(result.draft.items || []); }
      }
    } catch (err) { setToast({ msg:'خطا: ' + (err.message || ''), type:'error' }); }
  };

  const submitCart = async () => {
    if (!cartItems || cartItems.length === 0) { setToast({ msg:'سبد خرید خالی است', type:'error' }); return; }
    setSubmittingCart(true);
    try {
      const result = await apiCall('/crm-draft-orders/me/submit', { method: 'POST' });
      if (result && result.ok) {
        setToast({ msg:`سفارش #${result.order_id} با موفقیت ثبت شد`, type:'success' });
        setCart(null); setCartItems([]);
        setShowCart(false);
        refreshOrders();
      }
    } catch (err) {
      const msg = err.message || '';
      if (msg.includes('وجود ندارد')) setToast({ msg:'سبد خریدی برای ثبت وجود ندارد', type:'error' });
      else setToast({ msg:'خطا در ثبت سفارش: ' + msg, type:'error' });
    } finally {
      setSubmittingCart(false);
    }
  };

  const refreshOrders = async () => {
    if (!customer) return;
    try {
      const data = await apiCall(`/crm-orders?customer_id=${customer.id}`);
      setOrders(data.sort((a, b) => new Date(b.created_at) - new Date(a.created_at)));
    } catch (err) { console.error(err); }
  };

  // ── Hash-based routing: #/warranty or #/warranty-request ──────────
  useEffect(() => {
    const onHash = () => {
      const h = window.location.hash.toLowerCase().replace(/^#\/?/, '');
      if (h === 'warranty' || h === 'warranty-request') {
        if (customer) {
          setShowWarrantyForm(true);
        } else {
          setAuthScreen('warranty');
        }
      }
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, [customer]);

  // Not logged in → show auth screen based on selection
  if (!customer && !loading) {
    if (authScreen === 'retail') return <RetailLoginScreen onLogin={handleLogin} onBack={() => setAuthScreen('select')} />;
    if (authScreen === 'wholesale') return <LoginScreen onLogin={handleLogin} initialMobile={initialMobile} onBack={() => setAuthScreen('select')} />;
    if (authScreen === 'warranty') return <WarrantyForm onBack={() => setAuthScreen('select')} />;
    return <UserTypeSelection onSelect={(type) => setAuthScreen(type)} />;
  }
  if (loading) return <div style={{ position:"fixed", inset:0, display:"flex", alignItems:"center", justifyContent:"center", background:"#0A0A0A", color:C.textDim, fontSize:14, flexDirection:"column", gap:12 }}><img src="/splash-logo.png" alt="عقرب" style={{width:"100vw",height:"100vh",objectFit:"cover",objectPosition:"center",position:"fixed",top:0,left:0,zIndex:0}} />در حال بارگذاری...</div>;
  if (error && !customer) return <div style={{ position:"fixed", inset:0, display:"flex", alignItems:"center", justifyContent:"center", background:C.bg, color:C.danger, fontSize:14, flexDirection:"column", gap:16 }}><p>{error}</p><button onClick={() => {localStorage.removeItem('az_token');window.location.reload();}} style={{ padding:"10px 20px", borderRadius:8, border:"none", background:C.primary, color:"#111", fontWeight:600, cursor:"pointer", fontFamily:FF }}>تلاش مجدد</button></div>;

  return (
    <div style={{ minHeight:"100vh", background:C.bg, fontFamily:FF, direction:"rtl" }}>
      {/* Header */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"4px 16px", background:C.surface, borderBottom:`1px solid ${C.border}` }}>
        <div style={{ display:"flex", alignItems:"center", gap:4 }}>
          <img src="data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4NCjwhLS0gR2VuZXJhdG9yOiBBZG9iZSBJbGx1c3RyYXRvciAyMy4xLjAsIFNWRyBFeHBvcnQgUGx1Zy1JbiAuIFNWRyBWZXJzaW9uOiA2LjAwIEJ1aWxkIDApICAtLT4NCjxzdmcgdmVyc2lvbj0iMS4xIiBpZD0iTGF5ZXJfMSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIiB4bWxuczp4bGluaz0iaHR0cDovL3d3dy53My5vcmcvMTk5OS94bGluayIgeD0iMHB4IiB5PSIwcHgiDQoJIHZpZXdCb3g9IjAgMCA3NjggNzY4IiBzdHlsZT0iZW5hYmxlLWJhY2tncm91bmQ6bmV3IDAgMCA3NjggNzY4OyIgeG1sOnNwYWNlPSJwcmVzZXJ2ZSI+DQo8c3R5bGUgdHlwZT0idGV4dC9jc3MiPg0KCS5zdDB7ZmlsbDojRkZGRkZGO30NCjwvc3R5bGU+DQo8Zz4NCgk8Zz4NCgkJPGc+DQoJCQk8cGF0aCBjbGFzcz0ic3QwIiBkPSJNNTU2LDQzNS40Yy0xOC45LTE2LjctNDguNS00Mi45LTY3LjQtNTkuNWMtMS43LDEzLjktMy42LDI3LjYtNS43LDQxLjRjMTYsMTQuMSw0OC43LDQzLjEsNjQuNiw1Ny4xDQoJCQkJYy0xLjIsNS41LTE5LjEsODgtMTkuMSw4OHMzNi4yLTc2LjUsNTAuMi0xMDYuOWwtMjEuNy0xOS4xTDU1Niw0MzUuNEw1NTYsNDM1LjR6Ii8+DQoJCQk8cGF0aCBjbGFzcz0ic3QwIiBkPSJNNTgzLjksMTY4Ljl2OTYuNmMtNC4yLDMuNy0yNy44LDI0LjYtMzEuNCwyNy44Yy0wLjItMC4xLTU0LjMtNDgtNTQuNS00OC4ydjBjLTMuOS0xOS43LTE4LjgtOTYuMS0xOS43LTEwMQ0KCQkJCWMwLjEsMC4yLDcwLjYsMTE3LjQsNzAuNiwxMTcuNnYtODAuOWMtMC4xLTAuMi02Ny4yLTExMS44LTY3LjMtMTEyTDU4My45LDE2OC45TDU4My45LDE2OC45eiIvPg0KCQkJPHBhdGggY2xhc3M9InN0MCIgZD0iTTM4NiwzNzcuOWMtMjEsMTguNi01My4xLDQ3LTczLjksNjUuM2MyLjQsMTMuNCw0LjksMjYuNyw3LjYsMzkuNmMxOC40LTE2LjMsNDgtNDIuNSw2Ni4zLTU4LjYNCgkJCQljMTguMiwxNi4xLDQ3LjksNDIuNCw2Ni4zLDU4LjZjMi44LTEzLDUuMy0yNi4yLDcuNi0zOS42QzQ1MS40LDQzNS42LDM4NiwzNzcuOSwzODYsMzc3Ljl6Ii8+DQoJCQk8cGF0aCBjbGFzcz0ic3QwIiBkPSJNMzg2LDU5Ni42Yy0xNC4zLTEyLjctMzQuOC0zMC44LTQ5LjEtNDMuNWMwLjUsMiw0NS43LDEyNy4xLDQ5LjEsMTM0LjNjMy41LTcuMiw0OC42LTEzMi40LDQ5LjEtMTM0LjMNCgkJCQlDNDMzLjEsNTU0LjksMzk2LjgsNTg3LjEsMzg2LDU5Ni42eiIvPg0KCQkJPHBhdGggY2xhc3M9InN0MCIgZD0iTTQ2OC4yLDQ5Ni45bDE3LjIsMTUuMnY4OC4xbDAuMi0wLjJjNy4yLTMzLjMsMTcuMi03OS4yLDI0LjUtMTEyLjVsLTMzLjktMzANCgkJCQlDNDczLjcsNDcwLjksNDcxLDQ4NCw0NjguMiw0OTYuOUw0NjguMiw0OTYuOXoiLz4NCgkJCTxwYXRoIGNsYXNzPSJzdDAiIGQ9Ik01NTEsMzM4LjJjLTEzLjQtMTEuOC01NC42LTQ4LjMtNTQuNi           <span style={{ fontSize:13, fontWeight:500, color:C.textDim }}>محصولات غذایی عقرب</span>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:4 }}>
          <button onClick={() => setShowWarrantyForm(true)} style={{ display:"flex", alignItems:"center", gap:4, background:"transparent", border:"none", color:C.primary, cursor:"pointer", fontFamily:FF, fontSize:11, fontWeight:600, padding:"6px 8px", borderRadius:8 }}>
            <Icon name="warranty" size={15} />
            گارانتی
          </button>
          <button onClick={logout} style={{ display:"flex", alignItems:"center", gap:6, background:"transparent", border:"none", color:C.textDim, cursor:"pointer", fontFamily:FF, fontSize:12, padding:"6px 10px", borderRadius:8 }}>
            <IcLogout /> خروج
          </button>
        </div>
      </div>

      {/* Tab content */}
      {tab === 'home' && <HomeTab customer={customer} products={products} cartItems={cartItems} onAddToCart={addToCart} onNavigateProducts={() => setTab('products')} onNavigateOrders={() => setTab('orders')} />}
      {tab === 'products' && <ProductsTab products={products} customer={customer} cartItems={cartItems} onAddToCart={addToCart} onShowCart={() => setShowCart(true)} />}
      {tab === 'orders' && <OrdersTab orders={orders} onApprove={approveProforma} customer={customer} products={products} onOrderCreated={refreshOrders} deepLinkData={deepLinkData} clearDeepLink={() => setDeepLinkData(null)} onSelectOrder={(o) => setSelectedOrder(o)} />}
      {tab === 'profile' && <ProfileTab customer={customer} onWarranty={() => setShowWarrantyForm(true)} onSupport={() => setShowSupportForm(true)} onToast={(msg, type) => setToast({ msg, type })} />}

      {/* Cart panel overlay */}
      {showCart && (
        <CartPanel
          items={cartItems}
          onClose={() => setShowCart(false)}
          onUpdateQty={updateCartQty}
          onRemove={removeFromCart}
          onSubmit={submitCart}
          submitting={submittingCart}
        />
      )}
      <Toast toast={toast} onDone={() => setToast(null)} />

      {/* Warranty form overlay (logged-in users) */}
      {showWarrantyForm && <WarrantyForm onBack={() => setShowWarrantyForm(false)} />}

      {/* Support ticket form overlay */}
      {showSupportForm && <SupportTicketForm onClose={() => { setShowSupportForm(false); setSupportPrefillOrder(null); }} prefillOrderId={supportPrefillOrder} />}

      {/* Order detail bottom sheet */}
      {selectedOrder && <OrderDetailSheet order={selectedOrder} onClose={() => setSelectedOrder(null)} onSupport={(orderId) => { setSupportPrefillOrder(orderId); setShowSupportForm(true); }} />}

      {/* Bottom nav */}
      <nav style={{ position:"fixed", bottom:0, left:0, right:0, height:64, background:C.surface, borderTop:`1px solid ${C.border}`, display:"flex", justifyContent:"space-around", alignItems:"center", zIndex:1000 }}>
        {TABS.map(t => (
          <div key={t.id} onClick={() => setTab(t.id)} style={{ position:"relative", display:"flex", flexDirection:"column", alignItems:"center", gap:3, cursor:"pointer", flex:1, color: tab===t.id ? C.primary : C.textDim, transition:"color 0.2s" }}>
            <t.icon />
            <span style={{ fontSize:10, fontWeight: tab===t.id ? 700 : 400 }}>{t.label}</span>
          </div>
        ))}
        {/* Cart button with badge */}
        <div onClick={() => setShowCart(true)} style={{ position:"relative", display:"flex", flexDirection:"column", alignItems:"center", gap:3, cursor:"pointer", flex:1, color:C.textDim, transition:"color 0.2s" }}>
          <Icon name="cart" size={IZ.xl} />
          <span style={{ fontSize:10, fontWeight:400 }}>سبد خرید</span>
          {(cartItems?.length||0) > 0 && (
            <span style={{ position:"absolute", top:-4, right:"50%", marginRight:-14, background:C.danger, color:"#fff", fontSize:9, fontWeight:700, borderRadius:10, minWidth:18, height:18, display:"flex", alignItems:"center", justifyContent:"center", padding:"0 4px", border:`2px solid ${C.bg}` }}>
              {fa(cartItems.reduce((s,i) => s + (i.quantity||0), 0))}
            </span>
          )}
        </div>
      </nav>
    </div>
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch(e) {
  document.getElementById('root').textContent = 'RENDER ERROR: ' + (e.message || e) + '\\n' + (e.stack || '');
}
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/service-worker.js");
  });
}
</script>
</body>
</html>
