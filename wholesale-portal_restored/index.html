/* ═══════════════════════════════════════ CONFIG ══════════════════════════════════════ */
/* API base resolution — override via ?apiBase= , window.AZARMEHR_API_BASE, or
   localStorage.AZARMEHR_API_BASE. Defaults to the current production backend (no new hardcoded URL). */
const API_BASE = (() => {
  const src = new URLSearchParams(location.search).get('apiBase')
    || window.AZARMEHR_API_BASE
    || localStorage.getItem('AZARMEHR_API_BASE')
    || "https://azarmehr-backend.vercel.app/api";
  return src.replace(/\/+$/, '');
})();
const WHATSAPP_API_BASE = (() => {
  const src = new URLSearchParams(location.search).get('whatsappApiBase')
    || window.AZARMEHR_WHATSAPP_API_BASE
    || localStorage.getItem('AZARMEHR_WHATSAPP_API_BASE')
    || "https://whatsapp-broadcast-api.vercel.app";
  return src.replace(/\/+$/, '');
})();

/* ═══════════════════════════════════════ HELPERS ═════════════════════════════════════ */
const fa  = (n) => String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
const cur = (n) => fa(Number(n||0).toLocaleString()) + " ریال";
const shortCur = (n) => { const v=Number(n||0); return v>=1e9 ? fa((v/1e9).toFixed(1))+" م" : v>=1e6 ? fa((v/1e6).toFixed(1))+" م" : fa(v.toLocaleString()); };

function decodeJwt(token) {
  try { return JSON.parse(atob(token.split('.')[1])); } catch { return null; }
}

async function apiCall(endpoint, options = {}) {
  const token = localStorage.getItem('az_token');
  const headers = {
    'Content-Type': 'application/json',
    ...(token ? { Authorization: `Bearer ${token}` } : {}),
    ...options.headers,
  };
  const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: 'خطا در ارتباط با سرور' }));
    throw new Error(err.error || 'خطا');
  }
  return res.json();
}

function formatDate(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleDateString("fa-IR");
}

function formatPrice(num) {
  if (!num) return '—';
  return fa(Number(num).toLocaleString()) + ' ریال';
}

function RetailLoginScreen({ onLogin, onBack }) {
  const [name, setName] = useState('');
  const [phone, setPhone] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const iS = { width:"100%", padding:"11px 14px", background:C.bg, border:`1px solid ${C.border}`, borderRadius:10, color:C.text, fontSize:14, fontFamily:FF, boxSizing:"border-box" };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!name.trim()) { setError('نام و نام خانوادگی را وارد کنید'); return; }
    if (!phone.trim()) { setError('شماره تماس را وارد کنید'); return; }
    setLoading(true); setError('');
    try {
      const res = await fetch(`${API_BASE}/portal-login-retail`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name.trim(), phone: phone.trim() }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'خطا در ورود');
      localStorage.setItem('az_token', data.token);
      onLogin(data.token, data.user);

      // ── Welcome WhatsApp (non-blocking — fire-and-forget) ─────────────
      fetch(`${WHATSAPP_API_BASE}/api/send-customer-welcome`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: phone.trim(), name: name.trim(), customer_id: data.user?.id || null }),
      }).catch(() => {}); // silently ignore errors
    } catch (e) {
      setError(e.message || 'خطا در ارتباط با سرور');
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{ position:"fixed", inset:0, display:"flex", alignItems:"center", justifyContent:"center", background:C.bg, padding:16 }}>

function LoginScreen({ onLogin, initialMobile: im = '', onBack }) {
  const [mode, setMode] = useState("login"); // "login" | "register"
  const [customerType, setCustomerType] = useState("wholesale");
  const [legalType, setLegalType] = useState("individual");
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [name, setName] = useState("");
  const [companyName, setCompanyName] = useState("");
  const [nationalId, setNationalId] = useState("");
  const [companyNationalId, setCompanyNationalId] = useState("");
  const [economicCode, setEconomicCode] = useState("");
  const [ceoName, setCeoName] = useState("");
  const [phone, setPhone] = useState(im);
  const [email, setEmail] = useState("");
  const [city, setCity] = useState("");
  const [address, setAddress] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [showPassword, setShowPassword] = useState(false);
  const [registeredType, setRegisteredType] = useState(null); // null | 'wholesale' | 'retail'
  const [regCredentials, setRegCredentials] = useState(null); // { username, password } for retail
  const [installPrompt, setInstallPrompt] = useState(null);
  const [screen, setScreen] = useState("login"); // login | forgot | forgot_result
  const [forgotUser, setForgotUser] = useState("");
  const [showIOSPrompt, setShowIOSPrompt] = useState(false);
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !navigator.standalone;

  function handleForgot() {
    if (!forgotUser.trim()) { setError("نام کاربری را وارد کنید"); return; }
    setScreen("forgot_result");
    setError("");
  }

  useEffect(() => {
    const handler = (e) => { e.preventDefault(); setInstallPrompt(e); };
    window.addEventListener("beforeinstallprompt", handler);
    if (isIOS) setShowIOSPrompt(true);
    return () => window.removeEventListener("beforeinstallprompt", handler);
  }, []);

  const iS = { width:"100%", padding:"9px 12px", borderRadius:8, border:`1px solid ${C.border}`, background:C.surfaceAlt, color:C.text, fontFamily:FF, fontSize:13, boxSizing:"border-box" };

  const submitLogin = async (e) => {
    e.preventDefault();
    if (!username || !password) { setError("نام کاربری و رمز عبور را وارد کنید"); return; }
    setLoading(true); setError("");
    try {
      const res = await fetch(`${API_BASE}/portal-login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || data.message || "خطا در ورود");
      localStorage.setItem("az_token", data.token);
      onLogin(data.token, data.user);
    } catch (e) {
      setError(e.message || "نام کاربری یا رمز عبور اشتباه است");
    } finally {
      setLoading(false);
    }
  };

  const submitRegister = async (e) => {
    e.preventDefault();
    const type = legalType === "legal" ? "legal" : "individual";
    if (type === "legal" && !companyName.trim()) { setError("نام شرکت الزامی است"); return; }
    if (type === "individual" && !name.trim()) { setError("نام و نام خانوادگی الزامی است"); return; }
    if (!username.trim() || username.trim().length < 3) { setError("نام کاربری پیشنهادی باید حداقل ۳ حرف باشد"); return; }
    setLoading(true); setError("");
    try {
      const body = {
        username: username.trim(),
        customer_type: customerType,
        legal_type: type,
        phone: phone.trim() || undefined,
        email: email.trim() || undefined,
        city: city.trim() || undefined,
        address: address.trim() || undefined,
      };
      if (type === "legal") {
        body.company_name = companyName.trim();
        body.company_national_id = companyNationalId.trim() || undefined;
        body.economic_code = economicCode.trim() || undefined;
        body.ceo_name = ceoName.trim() || undefined;
      } else {
        body.name = name.trim();
        body.national_id = nationalId.trim() || undefined;
      }
      const res = await fetch(`${API_BASE}/portal-register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "خطا در ثبت درخواست");
      // موفقیت — retail خودکار فعال می‌شود، wholesale منتظر تأیید
      if (data.auto_approved && data.credentials) {
        setRegCredentials(data.credentials);
      }
      setRegisteredType(data.auto_approved ? 'retail' : 'wholesale');
    } catch (e) {
      setError(e.message || "خطا در ثبت درخواست");
    } finally {
      setLoading(false);
    }
  };

      <div style={{ background:C.surface, borderRadius:14, border:`1px solid ${C.border}`, padding:20, marginTop:14 }}>
        <h3 style={{ fontSize:15, fontWeight:600, color:C.text, marginBottom:10 }}>پشتیبانی و پیگیری</h3>
        <p style={{ fontSize:11, color:C.textDim, lineHeight:1.7, marginBottom:10 }}>
          برای پیگیری سفارش، سوالات ثبت سفارش، گارانتی یا مرجوعی از راه‌های زیر استفاده کنید.
        </p>
        <p style={{ fontSize:10, color:C.warning, marginBottom:10, background:C.warningDim, borderRadius:6, padding:"5px 8px", fontWeight:600 }}>
          استعلام قیمت فقط از طریق پورتال انجام می‌شود.
        </p>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
          {onSupport && <button onClick={onSupport} style={{ padding:"10px", borderRadius:8, border:`1px solid ${C.border}`, background:C.surfaceAlt, cursor:"pointer", fontFamily:FF, fontSize:11, fontWeight:600, color:C.text }}>
            <svg width="16" height="16" fill="none" stroke={C.primary} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{display:"block",margin:"0 auto 4px"}}><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
            ثبت درخواست پشتیبانی
          </button>}
          {onOrders && <button onClick={onOrders} style={{ padding:"10px", borderRadius:8, border:`1px solid ${C.border}`, background:C.surfaceAlt, cursor:"pointer", fontFamily:FF, fontSize:11, fontWeight:600, color:C.text }}>
            <svg width="16" height="16" fill="none" stroke={C.info} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{display:"block",margin:"0 auto 4px"}}><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8m8 4H8m2-8H8"/></svg>
            پیگیری سفارش
          </button>}
          {onWarranty && <button onClick={onWarranty} style={{ padding:"10px", borderRadius:8, border:`1px dashed ${C.primary}55`, background:"transparent", cursor:"pointer", fontFamily:FF, fontSize:11, fontWeight:600, color:C.primary }}>
            <svg width="16" height="16" fill="none" stroke={C.primary} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{display:"block",margin:"0 auto 4px"}}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
            گارانتی/مرجوعی
          </button>}
          {onProducts && <button onClick={onProducts} style={{ padding:"10px", borderRadius:8, border:`1px solid ${C.border}`, background:C.surfaceAlt, cursor:"pointer", fontFamily:FF, fontSize:11, fontWeight:600, color:C.text }}>
            <svg width="16" height="16" fill="none" stroke={C.primary} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{display:"block",margin:"0 auto 4px"}}><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/></svg>
            مشاهده محصولات
          </button>}
        </div>
      </div>
    </div>
                      <button onClick={()=>setShowIOSPrompt(false)} style={{width:"100%",padding:14,borderRadius:12,background:"#D4880E",border:"none",color:"#111",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>متوجه شدم</button>
                    </div>
                  </div>
                )}

                

                {/* فوتر */}
                <div style={{textAlign:"center",marginTop:24,fontSize:10,color:"#4B5563",opacity:0.5}}>
                  نسخه ۱.۰ | کلیه حقوق محفوظ است © آذرمهرصنعت
                </div>
              </>
            )}

            {/* صفحه فراموشی رمز */}
            {screen === "forgot" && (
              <>
                <div style={{textAlign:"center",marginBottom:24}}>
                  <div style={{fontSize:16,fontWeight:700,color:"#D1D3D4",marginBottom:8}}>فراموشی رمز عبور</div>
                  <div style={{fontSize:13,color:"#6B7280",lineHeight:1.7}}>نام کاربری خود را وارد کنید</div>
                </div>
                <div style={{marginBottom:16}}>
                  <div style={{fontSize:11,fontWeight:600,color:"#6B7280",marginBottom:5}}>نام کاربری</div>
                  <input
                    style={{
                      width:"100%", background:"#131313",
                      border:"1px solid #2A2A2A", borderRadius:10,
                      padding:"10px 14px", color:"#D1D3D4",
                      fontSize:13, outline:"none",
                      direction:"ltr", textAlign:"left",
                      fontFamily:"inherit", boxSizing:"border-box"
                    }}
                    placeholder="username"
                    value={forgotUser}
                    onChange={e=>{setForgotUser(e.target.value);setError("");}}
                    autoCapitalize="none"
                  />
                </div>
                {error && (
                  <div style={{background:"#C94B3F22",borderRadius:8,padding:"10px 14px",fontSize:13,color:"#C94B3F",marginBottom:14,textAlign:"center"}}>{error}</div>
                )}
                <button
                  type="button"
                  onClick={handleForgot}
                  style={{
                    width:"100%", padding:"11px 20px",
                    borderRadius:10, border:"none",
                    background:"#D4880E", color:"#111",
                    fontSize:13, fontWeight:700, cursor:"pointer",
                    fontFamily:"inherit", boxShadow:"0 0 20px #D4880E33",
                    marginBottom:12
                  }}
                >
                  ادامه
                </button>
                <button
                  type="button"
                  onClick={()=>{setScreen("login");setError("");}}
                  style={{
                    width:"100%", padding:"11px",
                    borderRadius:10, border:"1px solid #2A2A2A",
                    background:"transparent", color:"#6B7280",
                    fontSize:13, cursor:"pointer", fontFamily:"inherit"
                  }}
                >
                  بازگشت به ورود
                </button>
              </>
            )}

            {/* نتیجه فراموشی رمز */}
            {screen === "forgot_result" && (
              <>
                <div style={{textAlign:"center",marginBottom:24}}>
                  <Icon name="headset" size={36} style={{color:C.primary}} />
                  <div style={{fontSize:16,fontWeight:700,color:"#D1D3D4",marginBottom:8}}>بازیابی رمز عبور</div>
                  <div style={{fontSize:13,color:"#6B7280",marginBottom:16,lineHeight:1.8}}>
                    برای بازیابی رمز عبور کاربر{" "}
                    <span style={{color:"#D4880E",fontWeight:700}}>{forgotUser}</span>{" "}
                    با مدیر سیستم تماس بگیرید:
                  </div>
                  <div style={{background:"#131313",border:"1px solid #2A2A2A",borderRadius:10,padding:14,fontSize:14,color:"#D4880E"}}>
                    بزرگمهر یا کریم‌لو
                  </div>
                  <div style={{fontSize:12,color:"#4B5563",marginTop:10}}>
                    مدیر سیستم رمز جدید را از طریق پنل مدیریت تنظیم خواهد کرد.
                  </div>
                </div>
                <button
                  type="button"
                  onClick={()=>{setScreen("login");setError("");setForgotUser("");}}
                  style={{
                    width:"100%", padding:"11px 20px",
                    borderRadius:10, border:"none",
                    background:"#D4880E", color:"#111",
                    fontSize:13, fontWeight:700, cursor:"pointer",
                    fontFamily:"inherit", boxShadow:"0 0 20px #D4880E33"
                  }}
                >
                  بازگشت به ورود
                </button>
              </>
            )}
          </>
        ) : registeredType ? (
          /* ═══════════════════════ REGISTER SUCCESS ═══════════════════ */
          <div style={{ textAlign:"center", padding:"16px 0" }}>
            <div style={{ width:48, height:48, borderRadius:"50%", background:C.successDim, display:"flex", alignItems:"center", justifyContent:"center", margin:"0 auto 12px" }}>
              <Icon name="check" size={28} style={{color:C.success}} />
            </div>
            <p style={{ fontSize:15, fontWeight:600, color:C.text, marginBottom:8 }}>
              {registeredType === 'retail' ? 'ثبت‌نام با موفقیت انجام شد' : 'درخواست شما ثبت شد'}
            </p>
            <p style={{ fontSize:13, color:C.textMuted, marginBottom:20, lineHeight:1.7 }}>
              {registeredType === 'retail' ? (
                <>اطلاعات شما ثبت شد. می‌توانید با اطلاعات زیر وارد پورتال شوید:</>
              ) : (
                <>اطلاعات شما با موفقیت دریافت شد.<br />
                پس از تأیید مدیر، نام کاربری و رمز عبور برای شما صادر خواهد شد<br />
                و از طریق پیامک اطلاع‌رسانی می‌گردد.</>
              )}
            </p>
            {registeredType === 'retail' && regCredentials && (
              <div style={{ background:C.surfaceAlt, borderRadius:10, padding:14, marginBottom:16, textAlign:"right" }}>
                <div style={{ fontSize:11, color:C.textMuted, marginBottom:4 }}>نام کاربری</div>
                <div style={{ fontSize:15, fontWeight:700, color:C.text, fontFamily:"monospace", direction:"ltr", textAlign:"left", marginBottom:12 }}>{regCredentials.username}</div>
                <div style={{ fontSize:11, color:C.textMuted, marginBottom:4 }}>رمز عبور</div>
                <div style={{ fontSize:15, fontWeight:700, color:C.text, fontFamily:"monospace", direction:"ltr", textAlign:"left" }}>{regCredentials.password}</div>
              </div>
            )}
            <button onClick={() => { setMode("login"); setRegisteredType(null); setRegCredentials(null); setError(""); }}
              style={{ padding:"12px 36px", borderRadius:12, border:"none", background:C.primary, color:"#111", fontWeight:700, cursor:"pointer", fontFamily:FF, fontSize:14 }}>
              بازگشت به صفحه ورود
            </button>
          </div>
        ) : (
          /* ═══════════════════════ REGISTER FORM ═════════════════════ */
          <form onSubmit={submitRegister}>
            {/* Customer type selector */}
            <div style={{ display:"flex", background:C.bg, borderRadius:8, padding:2, marginBottom:8 }}>
              {[["wholesale","عمده‌فروش"],["retail","خرده‌فروش"]].map(([k,l]) => (
                <div key={k} onClick={()=>{setCustomerType(k);setError("");}} style={{ flex:1, textAlign:"center", padding:"6px 0", borderRadius:6, cursor:"pointer", fontWeight:600, fontSize:12, background:customerType===k?C.primary:"transparent", color:customerType===k?"#111":C.textMuted, fontFamily:FF, transition:"all 0.2s" }}>
                  {l}
                </div>
              ))}
            </div>
            <div style={{ fontSize:10, color:C.textDim, textAlign:"center", marginBottom:12, lineHeight:1.6 }}>
              {customerType === "retail"
                ? "🛍️ خرده‌فروش — پس از ثبت، بلافاصله فعال می‌شوید"
                : "🏪 عمده‌فروش — پس از تأیید مدیر، دسترسی شما فعال می‌شود"}
            </div>

            {/* Legal type toggle */}
            <div style={{ display:"flex", background:C.bg, borderRadius:8, padding:2, marginBottom:14 }}>
              {[["individual","حقیقی"],["legal","حقوقی"]].map(([k,l]) => (
                <div key={k} onClick={()=>{setLegalType(k);setError("");}} style={{ flex:1, textAlign:"center", padding:"6px 0", borderRadius:6, cursor:"pointer", fontWeight:600, fontSize:12, background:legalType===k?C.surfaceHover:"transparent", color:legalType===k?C.text:C.textMuted, fontFamily:FF, transition:"all 0.2s" }}>
                  {l}
                </div>
              ))}
            </div>

            {/* Individual fields */}
            {legalType === "individual" && (
              <>
                <div style={{ marginBottom:12 }}><Lbl>نام و نام خانوادگی *</Lbl><input className="login-input" value={name} onChange={e=>setName(e.target.value)} style={iS} /></div>
                <div style={{ marginBottom:12 }}><Lbl>کد ملی</Lbl><input className="login-input" value={nationalId} onChange={e=>setNationalId(e.target.value)} style={iS} /></div>
              </>
            )}

            {/* Legal fields */}
            {legalType === "legal" && (
              <>
                <div style={{ marginBottom:12 }}><Lbl>نام شرکت *</Lbl><input className="login-input" value={companyName} onChange={e=>setCompanyName(e.target.value)} style={iS} /></div>
                <div style={{ marginBottom:12 }}><Lbl>شناسه ملی شرکت</Lbl><input className="login-input" value={companyNationalId} onChange={e=>setCompanyNationalId(e.target.value)} style={iS} /></div>
                <div style={{ marginBottom:12 }}><Lbl>کد اقتصادی</Lbl><input className="login-input" value={economicCode} onChange={e=>setEconomicCode(e.target.value)} style={iS} /></div>
                <div style={{ marginBottom:12 }}><Lbl>نام مدیرعامل</Lbl><input className="login-input" value={ceoName} onChange={e=>setCeoName(e.target.value)} style={iS} /></div>
              </>
            )}

            {/* Common fields */}
            <div style={{ marginBottom:12 }}>
              <Lbl>شماره تماس</Lbl>
              <input className="login-input" value={phone} onChange={e=>setPhone(e.target.value)} style={iS} />
            </div>
            <div style={{ marginBottom:12 }}>
              <Lbl>ایمیل</Lbl>
              <input className="login-input" type="email" value={email} onChange={e=>setEmail(e.target.value)} style={iS} />
            </div>
            <div style={{ marginBottom:12 }}>
              <Lbl>شهر</Lbl>
              <input className="login-input" value={city} onChange={e=>setCity(e.target.value)} style={iS} />
            </div>
            <div style={{ marginBottom:12 }}>
              <Lbl>آدرس</Lbl>
              <input className="login-input" value={address} onChange={e=>setAddress(e.target.value)} style={iS} />
            </div>
            <div style={{ marginBottom:12 }}>
              <Lbl>نام کاربری پیشنهادی *</Lbl>
              <input className="login-input" value={username} onChange={e=>setUsername(e.target.value)} style={iS} />
            </div>
            <div style={{ marginBottom:8, fontSize:11, color:C.textDim, lineHeight:1.6 }}>
              ⏳ پس از ثبت درخواست، مدیر فروش اطلاعات شما را بررسی می‌کند.<br />
              پس از تأیید، نام کاربری و رمز عبور برای شما صادر خواهد شد.
            </div>

            <button type="submit" disabled={loading} style={{ width:"100%", padding:"14px", borderRadius:12, border:"none", background:C.primary, color:"#111", fontWeight:700, cursor:loading?"not-allowed":"pointer", fontFamily:FF, fontSize:15, opacity:loading?0.7:1 }}>
              {loading ? "در حال ثبت..." : "ثبت درخواست"}
            </button>
          </form>
        )}

      </div>
    </div>
  );
}

function OrderForm({ customer, products, onClose, onCreated, initialProductId, initialQty, initialMobile }) {
  const [rows, setRows] = useState([{ product_id:'', product_name:'', qty:1, unit_price:0, total:0 }]);
  const [submitting, setSubmitting] = useState(false);

  // Deep-link: prefill ردیف اول با محصول و تعداد درخواستی
  useEffect(() => {
    if (initialProductId && products && products.length > 0) {
      const grade = customer?.grade || 'standard';
      const priceField = GRADE_PRICE_MAP[grade] || 'price_standard';
      const prod = products.find(p => p.id === Number(initialProductId));

      if (prod && prod.active && Number(prod[priceField] || 0) > 0) {
        const price = Number(prod[priceField]);
        const targetQty = initialQty && !isNaN(initialQty) ? Math.max(1, initialQty) : 1;
        setRows([{
          product_id: prod.id.toString(),
          product_name: prod.name,
          qty: targetQty,
          unit_price: price,
          total: price * targetQty,
        }]);
      } else {
        alert('محصول درخواستی یافت نشد یا در دسترس نیست.');
      }
    }
  }, [initialProductId, initialQty, products, customer]);

  const grade = customer?.grade || 'standard';
  const priceField = GRADE_PRICE_MAP[grade] || 'price_standard';

  // محصولات فعال + دارای قیمت برای این سطح
  const availProducts = (products||[]).filter(p => p.active === true && Number(p[priceField]||0) > 0);

  const grandTotal = rows.reduce((s, r) => s + r.total, 0);
  const isValid = rows.some(r => r.product_id && Number(r.qty) > 0);

  const addRow = () => {
    setRows(prev => [...prev, { product_id:'', product_name:'', qty:1, unit_price:0, total:0 }]);
  };

  const removeRow = (idx) => {
    if (rows.length <= 1) return;
    setRows(prev => prev.filter((_, i) => i !== idx));
  };

  const updateRow = (idx, field, value) => {
    setRows(prev => {
      const newRows = prev.map(r => ({ ...r }));
      if (field === 'product_id') {
        const prod = products.find(p => p.id === Number(value));
        if (prod) {
          const price = Number(prod[priceField]) || 0;
          newRows[idx].product_id = prod.id;
          newRows[idx].product_name = prod.name;
          newRows[idx].unit_price = price;
          newRows[idx].qty = 1;
          newRows[idx].total = price;
        } else {
          newRows[idx] = { product_id:'', product_name:'', qty:1, unit_price:0, total:0 };
        }
      } else if (field === 'qty') {
        const q = Math.max(1, Number(value) || 1);
        newRows[idx].qty = q;
        newRows[idx].total = newRows[idx].unit_price * q;
      }
      return newRows;
    });
  };

/* ═══════════════════════════════════════ INVOICES TAB ═════════════════════════════════ */
function InvoicesTab({ customer }) {
  const [payments, setPayments] = useState([]);
  const [loading, setLoading] = useState(true);
  const [amount, setAmount] = useState('');
  const [method, setMethod] = useState('کارت به کارت');
  const [orderId, setOrderId] = useState('');
  const [paymentNote, setPaymentNote] = useState('');
  const [submitting, setSubmitting] = useState(false);

  const fetchPayments = async () => {
    try {
      const data = await apiCall(`/crm-payments`);
      setPayments(data||[]);
    } catch (e) { console.error(e); }
  };

  useEffect(() => { (async () => { await fetchPayments(); setLoading(false); })(); }, [customer.id]);

  const handleSubmitPayment = async (e) => {
    e.preventDefault();
    const parsed = Number(amount);
    if (!amount || !Number.isFinite(parsed) || parsed <= 0) { alert('مبلغ معتبر وارد کنید'); return; }
    setSubmitting(true);
    try {
      const body = { amount: parsed, payment_method: method, note: paymentNote || undefined };
      if (orderId && Number(orderId) > 0) body.order_id = Number(orderId);
      await apiCall('/crm-payment-submit', { method: 'POST', body: JSON.stringify(body) });
      alert('پرداخت ثبت شد و در انتظار تایید است');
      setAmount(''); setMethod('کارت به کارت'); setOrderId(''); setPaymentNote('');
      await fetchPayments();
    } catch (err) {
      alert('خطا: ' + (err.message || ''));
    } finally { setSubmitting(false); }
  };

  const iS = { width:"100%", padding:"11px 14px", background:C.bg, border:`1px solid ${C.border}`, borderRadius:10, color:C.text, fontSize:14, fontFamily:FF, boxSizing:"border-box" };

  if (loading) return <div style={{ padding:20, textAlign:"center", color:C.textDim }}>در حال بارگذاری...</div>;

  return (
    <div style={{ padding:"20px 16px 100px", maxWidth:800, margin:"0 auto" }}>
      <div style={{ background:C.surface, borderRadius:14, border:`1px solid ${C.border}`, padding:20, marginBottom:18 }}>
        <h3 style={{ fontSize:15, fontWeight:600, color:C.text, marginBottom:16 }}>ثبت پرداخت جدید</h3>
        <form onSubmit={handleSubmitPayment}>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:12 }}>
            <div>
              <label style={{ display:"block", fontSize:12, color:C.textMuted, marginBottom:4, fontWeight:600 }}>مبلغ (ریال) *</label>
              <input type="number" min="1" required value={amount} onChange={e => setAmount(e.target.value)} placeholder="مثال: ۵۰۰۰۰۰۰" style={iS} />
            </div>
            <div>
              <label style={{ display:"block", fontSize:12, color:C.textMuted, marginBottom:4, fontWeight:600 }}>روش پرداخت</label>
              <select value={method} onChange={e => setMethod(e.target.value)} style={{ ...iS, cursor:"pointer" }}>
                <option value="کارت به کارت">کارت به کارت</option>
                <option value="واریز به حساب">واریز به حساب</option>
                <option value="چک">چک</option>
                <option value="نقدی">نقدی</option>
              </select>
            </div>
          </div>
          <div style={{ marginBottom:12 }}>
            <label style={{ display:"block", fontSize:12, color:C.textMuted, marginBottom:4, fontWeight:600 }}>شماره سفارش (اختیاری)</label>
            <input type="number" min="1" value={orderId} onChange={e => setOrderId(e.target.value)} placeholder="شماره سفارش مرتبط" style={iS} />
          </div>
          <div style={{ marginBottom:16 }}>
            <label style={{ display:"block", fontSize:12, color:C.textMuted, marginBottom:4, fontWeight:600 }}>یادداشت (اختیاری)</label>
            <textarea rows={2} value={paymentNote} onChange={e => setPaymentNote(e.target.value)} placeholder="..." style={{ ...iS, resize:"vertical" }} />
          </div>
          <button type="submit" disabled={submitting} style={{ width:"100%", padding:"12px", borderRadius:10, border:"none", background:C.primary, color:"#111", fontWeight:700, cursor:submitting?"not-allowed":"pointer", fontFamily:FF, fontSize:14, opacity:submitting?0.7:1 }}>
            {submitting ? "در حال ثبت..." : "ثبت پرداخت"}
          </button>
        </form>
      </div>

      <h3 style={{ fontSize:15, fontWeight:600, color:C.text, marginBottom:12 }}>سابقه پرداخت‌ها</h3>
      {payments.length === 0
        ? <p style={{ fontSize:13, color:C.textDim, textAlign:"center", padding:20 }}>پرداختی ثبت نشده</p>
        : payments.map(p => (
            <div key={p.id} style={{ background:C.surface, borderRadius:12, border:`1px solid ${C.border}`, padding:14, marginBottom:8, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <div>
                <p style={{ fontSize:13, fontWeight:600, color:C.text }}>#{fa(p.id)}</p>
                <p style={{ fontSize:11, color:C.textDim }}>{formatDate(p.created_at)}</p>
              </div>
              <div style={{ textAlign:"left" }}>
                <p style={{ fontSize:14, fontWeight:700, color:C.primary }}>{shortCur(p.amount)}</p>
                <span style={{ fontSize:10, padding:"2px 7px", borderRadius:4, background: p.status==='approved'?C.successDim : p.status==='rejected'?C.dangerDim : C.warningDim, color: p.status==='approved'?C.success : p.status==='rejected'?C.danger : C.warning, fontWeight:600 }}>
                  {p.status === 'approved' ? 'تایید شده' : p.status === 'rejected' ? 'رد شده' : 'در انتظار تایید'}
                </span>
              </div>
            </div>
          ))
      }
    </div>
  );
}

/* ═══════════════════════════════════════ PROFILE TAB ══════════════════════════════════ */
function ProfileTab({ customer, onWarranty, onSupport, onToast }) {
  const [editing, setEditing] = useState(false);
  const [saving, setSaving] = useState(false);
  const [form, setForm] = useState({});
  const [errMsg, setErrMsg] = useState('');

  useEffect(() => {
    if (customer) {
      setForm({
        name: customer.name || customer.store_name || customer.company_name || customer.username || '',
        phone: customer.phone || '',
        city: customer.city || '',
        address: customer.address || '',
        postal_code: customer.postal_code || '',
        store_name: customer.store_name || customer.company_name || '',
        email: customer.email || '',
      });
    }
  }, [customer]);

  const handleSave = async () => {
    setErrMsg('');
    if (!form.name.trim()) { setErrMsg('نام نمی‌تواند خالی باشد'); return; }
    if (form.phone) {
      const digits = form.phone.replace(/\D/g, '');
      if (digits.length < 10 || digits.length > 13) { setErrMsg('شماره تماس معتبر نیست'); return; }
    }
    if (form.postal_code) {
      const pc = form.postal_code.replace(/\D/g, '');
      if (pc.length !== 10) { setErrMsg('کد پستی باید ۱۰ رقم باشد'); return; }
    }
    setSaving(true);
    try {
      await apiCall('/portal-profile', {
        method: 'PUT',
        body: JSON.stringify(form),
      });
      setEditing(false);
      // Update local customer state by re-fetching profile
      try {
        const full = await apiCall(`/crm-customers?id=${customer.id}`);
        if (full && full.length > 0) {
          Object.assign(customer, full[0]);
        }
      } catch (_) {}
      if (onToast) onToast('پروفایل با موفقیت به‌روز شد', 'success');
    } catch (e) {
      setErrMsg(e.message || 'خطا در ذخیره');
    } finally {
      setSaving(false);
    }
  };

  const handleCancel = () => {
    setEditing(false);
    setErrMsg('');
    // Reset form
    if (customer) {
      setForm({
        name: customer.name || customer.store_name || customer.company_name || customer.username || '',
        phone: customer.phone || '',
        city: customer.city || '',
        address: customer.address || '',
        postal_code: customer.postal_code || '',
        store_name: customer.store_name || customer.company_name || '',
        email: customer.email || '',
      });
    }
  };

  const fields = [
    { key:'name', label:'نام و نام خانوادگی / نام فروشگاه', type:'text' },
    { key:'phone', label:'شماره تماس', type:'tel' },
    { key:'city', label:'شهر', type:'text' },
    { key:'address', label:'آدرس', type:'text' },
    { key:'postal_code', label:'کد پستی', type:'text' },
    { key:'email', label:'ایمیل', type:'email' },
  ];

  const iS = { width:"100%", padding:"10px 12px", background:C.surfaceAlt, border:`1px solid ${C.border}`, borderRadius:8, color:C.text, fontSize:13, fontFamily:FF, boxSizing:"border-box" };

  return (
    <div style={{ padding:"20px 16px 100px", maxWidth:800, margin:"0 auto" }}>
      {/* Profile card */}
      <div style={{ background:C.surface, borderRadius:14, border:`1px solid ${C.border}`, padding:20, marginBottom:14 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
          <h3 style={{ fontSize:16, fontWeight:700, color:C.text }}>پروفایل من</h3>
          {!editing && (
            <button onClick={() => setEditing(true)} style={{ display:"flex", alignItems:"center", gap:4, padding:"6px 14px", borderRadius:8, border:`1px solid ${C.border}`, background:"transparent", color:C.primary, cursor:"pointer", fontFamily:FF, fontSize:12, fontWeight:600 }}>
              <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4l-6 6-1 3 3-1 6-6a2 2 0 00-2-2z"/><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/></svg>
              ویرایش
            </button>
          )}
        </div>

        {errMsg && (
          <div style={{ background:C.dangerDim, border:`1px solid ${C.danger}44`, borderRadius:8, padding:"8px 12px", fontSize:12, color:C.danger, marginBottom:12, textAlign:"center" }}>{errMsg}</div>
        )}

        {fields.map(f => (
          <div key={f.key} style={{ marginBottom:10 }}>
            <label style={{ display:"block", fontSize:11, color:C.textMuted, marginBottom:3, fontWeight:600 }}>{f.label}</label>
            {editing ? (
              <input type={f.type} value={form[f.key] || ''} onChange={e => setForm(prev => ({ ...prev, [f.key]: e.target.value }))} style={iS} autoComplete={f.key === 'email' ? 'email' : f.key === 'phone' ? 'tel' : f.key === 'address' ? 'street-address' : f.key === 'postal_code' ? 'postal-code' : 'off'} />
            ) : (
              <div style={{ padding:"10px 12px", background:C.surfaceAlt, border:`1px solid transparent`, borderRadius:8, color:C.text, fontSize:13, minHeight:38, opacity:0.85 }}>
                {form[f.key] || <span style={{ color:C.textDim, fontSize:11 }}>وارد نشده</span>}
              </div>
            )}
          </div>
        ))}

        {editing && (
          <div style={{ display:"flex", gap:10, marginTop:16 }}>
            <button onClick={handleSave} disabled={saving} style={{ flex:1, padding:"11px", borderRadius:8, border:"none", background:C.primary, color:"#111", fontWeight:700, cursor:saving?"not-allowed":"pointer", fontFamily:FF, fontSize:13, opacity:saving?0.6:1 }}>
              {saving ? "در حال ذخیره..." : "ذخیره تغییرات"}
            </button>
            <button onClick={handleCancel} disabled={saving} style={{ padding:"11px 20px", borderRadius:8, border:`1px solid ${C.border}`, background:"transparent", color:C.textDim, fontWeight:600, cursor:"pointer", fontFamily:FF, fontSize:13 }}>
              انصراف
            </button>
          </div>
        )}
      </div>

      {/* ── Support section ──────────────────────────────────────────────── */}
      <div style={{ background:C.surface, borderRadius:14, border:`1px solid ${C.border}`, padding:20, marginBottom:14 }}>
        <h3 style={{ fontSize:15, fontWeight:700, color:C.text, marginBottom:12 }}>پشتیبانی و پیگیری</h3>
        <p style={{ fontSize:12, color:C.textDim, lineHeight:1.7, marginBottom:14 }}>
          برای پیگیری سفارش، سوالات ثبت سفارش، گارانتی یا مرجوعی از راه‌های زیر استفاده کنید.
        </p>
        <p style={{ fontSize:11, color:C.warning, marginBottom:14, background:C.warningDim, borderRadius:6, padding:"6px 10px", fontWeight:600 }}>
          استعلام قیمت فقط از طریق پورتال انجام می‌شود.
        </p>
        <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
          <button onClick={onSupport} style={{ padding:"12px", borderRadius:10, border:`1px solid ${C.border}`, background:C.surfaceAlt, display:"flex", alignItems:"center", gap:10, cursor:"pointer", fontFamily:FF }}>
            <svg width="18" height="18" fill="none" stroke={C.primary} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
            <span style={{ flex:1, fontSize:13, fontWeight:600, color:C.text, textAlign:"right" }}>ثبت درخواست پشتیبانی</span>
            <svg width="14" height="14" fill="none" stroke={C.textDim} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 4 15 10 9 16"/></svg>
          </button>
          <button onClick={() => { const t = window.TABS_REF?.setTab; if (t) t('orders'); else window.location.hash = '#/orders'; }} style={{ padding:"12px", borderRadius:10, border:`1px solid ${C.border}`, background:C.surfaceAlt, display:"flex", alignItems:"center", gap:10, cursor:"pointer", fontFamily:FF }}>
            <svg width="18" height="18" fill="none" stroke={C.info} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8m8 4H8m2-8H8"/></svg>
            <span style={{ flex:1, fontSize:13, fontWeight:600, color:C.text, textAlign:"right" }}>پیگیری سفارش</span>
            <svg width="14" height="14" fill="none" stroke={C.textDim} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 4 15 10 9 16"/></svg>

/* ═══════════════════════════════════════ HELPERS: SAFE TEXT ═════════════════════════ */
/* Guard against undefined, null, NaN, or "????" in UI output */
function safeText(val, fallback = '') {
  if (val === null || val === undefined) return fallback;
  const s = String(val).trim();
  if (!s || s === 'null' || s === 'undefined' || s === 'NaN' || s === '????') return fallback;
  return s;
}
function safeNum(val) {
  const n = Number(val);
  return isNaN(n) ? 0 : n;
}

function ProductsTab({ products, customer, cartItems, onAddToCart, onShowCart }) {
  const [search, setSearch] = useState('');
  const grade = customer?.grade || 'standard';
  const priceField = GRADE_PRICE_MAP[grade] || 'price_standard';

  const is10kg = (p) => {
    const normalize = (s) => (s||'').replace(/[\s\-]/g, '').replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
    const sz = normalize(p?.package_size);
    const pk = normalize(p?.packaging);
    const wv = Number(p?.weight_value) || 0;
    const wu = (p?.weight_unit || '').toLowerCase();
    return sz.includes('10کیلو') || sz.includes('10kg')
        || pk.includes('10کیلو') || pk.includes('10kg')
        || (wv >= 10 && wu === 'kg');
  };

  const filtered = products.filter(p => {
    if (!p) return false;
    if (!search) return true;
    const q = search.trim().toLowerCase();
    return safeText(p.name, '').toLowerCase().includes(q)
        || safeText(p.keywords, '').toLowerCase().includes(q)
        || safeText(p.category, '').toLowerCase().includes(q)
        || safeText(p.code, '').toLowerCase().includes(q)
        || safeText(p.sku, '').toLowerCase().includes(q)
        || safeText(p.packaging, '').toLowerCase().includes(q)
        || safeText(p.package_size, '').toLowerCase().includes(q);
  });

  const inCartMap = {};
  (cartItems || []).forEach(i => { if (i) inCartMap[Number(i.product_id)] = (i.quantity || 0); });

  // ----- Product Image component -----
  function ProductImage({ p }) {
    const [imgErr, setImgErr] = useState(false);
    const hasImg = p?.image_url && !imgErr;
    const imgHeight = 220;
    return (
      <div style={{ height:imgHeight, background:`linear-gradient(135deg, ${C.surfaceAlt} 0%, #1A1A1A 100%)`, display:"flex", alignItems:"center", justifyContent:"center", borderBottom:`1px solid ${C.border}`, position:"relative", overflow:"hidden", flexShrink:0 }}>
        {hasImg
          ? <img src={p.image_url} alt={safeText(p.name)} onError={() => setImgErr(true)}
                 style={{ width:"100%", height:"100%", objectFit:"cover", display:"block" }} />
          : <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:2, opacity:0.4 }}>
              <Icon name="image" size={22} />
              {safeText(p?.packaging) && <span style={{ fontSize:8, color:C.textMuted, textAlign:"center", padding:"0 4px" }}>{p.packaging}</span>}
            </div>
        }
        {inCartMap[p?.id] > 0 && (
          <span style={{ position:"absolute", top:3, left:3, background:C.primary, color:"#111", fontSize:8, fontWeight:700, borderRadius:6, minWidth:16, height:16, display:"flex", alignItems:"center", justifyContent:"center", padding:"0 3px", lineHeight:1 }}>
            {fa(inCartMap[p.id])}
          </span>
        )}
        {is10kg(p) && p?.code && (
          <span style={{ position:"absolute", bottom:4, right:4, background:"#000000aa", color:C.primary, fontSize:FZ.base, fontWeight:700, borderRadius:4, padding:"2px 8px", lineHeight:"20px" }}>
            کد {p.code}
          </span>
        )}
      </div>
    );
  }

  const isMobile = window.innerWidth < 640;

  return (
    <div style={{ padding: isMobile ? "8px 6px 72px" : "16px 16px 80px", maxWidth:1100, margin:"0 auto" }}>
      {/* Search bar */}
      <div style={{ position:"relative", marginBottom:isMobile ? 8 : 14 }}>
        <input
          value={search} onChange={e => setSearch(e.target.value)}
          placeholder="جستجوی محصول..."
          style={{ width:"100%", padding: isMobile ? "8px 30px 8px 8px" : "10px 36px 10px 12px", background:C.surfaceAlt, border:`1px solid ${C.border}`, borderRadius:8, color:C.text, fontSize: isMobile ? 12 : 13, fontFamily:FF, boxSizing:"border-box" }}
        />
        <Icon name="search" size={isMobile ? 13 : 15} style={{ position:"absolute", right: isMobile ? 7 : 10, top:"50%", transform:"translateY(-50%)", color:C.textDim, pointerEvents:"none" }} />
      </div>

      {/* Product grid */}
      {filtered.length === 0
        ? <p style={{ textAlign:"center", color:C.textDim, padding:40, fontSize:13 }}>{search ? 'محصولی یافت نشد' : 'محصولی موجود نیست'}</p>
        : <div style={{ display: isMobile ? "grid" : "grid", gridTemplateColumns: isMobile ? "repeat(2,minmax(0,1fr))" : "repeat(auto-fill,minmax(220px,1fr))", gap: isMobile ? 8 : 14 }}>
            {filtered.map(p => {
              if (!p || !p.id) return null;
              const price = safeNum(p[priceField] || p.base_price);
              const inCart = inCartMap[p.id] || 0;
              const productName = safeText(p.name, 'نام محصول نامشخص');
              const packagingText = safeText(p.packaging);
              const pkgSizeText = safeText(p.package_size);
              return (
                <div key={p.id} style={{ display:"flex", flexDirection:"column", borderRadius:8, overflow:"hidden", background:C.surface, border:`1px solid ${C.border}` }}>
                  <ProductImage p={p} />
                  <div style={{ padding:"6px", flex:1, display:"flex", flexDirection:"column", gap:"2px" }}>
                    {/* Name */}
                    <p style={{ fontSize: isMobile ? FZ.base : FZ.md, fontWeight:600, color:C.text, lineHeight:1.3, display:"-webkit-box", WebkitLineClamp:2, WebkitBoxOrient:"vertical", overflow:"hidden", minHeight: isMobile ? '34px' : '42px' }}>
                      {productName}

                    {/* Packaging / size */}
                    {(packagingText || pkgSizeText) && (
                      <p style={{ fontSize: isMobile ? FZ.xs : FZ.sm, color:C.textDim, overflow:"hidden", whiteSpace:"nowrap", textOverflow:"ellipsis" }}>

                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:"auto", flexShrink:0, paddingTop:"2px" }}>
                      <span style={{ fontSize: isMobile ? FZ.lg : FZ.xl, fontWeight:700, color: price > 0 ? C.primary : C.textDim, direction:"ltr", textAlign:"left" }}>
                        {price > 0 ? fa(Number(price).toLocaleString()) : 'استعلام از پورتال'}
                      </span>
                      <button
                        onClick={() => onAddToCart(p)}
                        style={{ border:"none", borderRadius:5, padding: isMobile ? "4px 6px" : "6px 10px", fontSize: isMobile ? 9 : 11, fontWeight:600, cursor:"pointer", fontFamily:FF, transition:"all 0.15s", display:"flex", alignItems:"center", gap:2, background: inCart > 0 ? C.success : C.primary, color: inCart > 0 ? "#fff" : "#111", height: isMobile ? 26 : 32, minWidth: isMobile ? 26 : 32, justifyContent:"center", lineHeight:1 }}
                      >
                        <Icon name={inCart > 0 ? "check" : "plus"} size={isMobile ? 10 : 12} />
                        {!isMobile && (inCart > 0 ? ' در سبد' : ' افزودن')}
                      </button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
      }
    </div>
  );
}

    try {
      const res = await fetch(`${API_BASE}/public-warranty-request`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },

          customer_name: name.trim(),
          customer_phone: phone.trim(),
          customer_address: address.trim(),
          postal_code: postalCode.trim(),
          product_code: productDesc.trim(),
          reason: reason.trim(),
