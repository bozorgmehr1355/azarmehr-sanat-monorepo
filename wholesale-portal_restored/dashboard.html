/* ══════════════════════════════════════ HELPERS ══════════════════════════════════════ */
const fa  = (n) => String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
const cur = (n) => fa(Number(n||0).toLocaleString()) + " ریال";

function formatDate(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleDateString("fa-IR");
}

function formatPrice(num) {
  if (!num) return '—';
  return fa(Number(num).toLocaleString()) + ' ریال';
}

function decodeJwt(token) {
  try { return JSON.parse(atob(token.split('.')[1])); } catch { return null; }
}

async function apiCall(endpoint, options = {}) {
  const token = localStorage.getItem('az_token');
  const headers = {
    'Content-Type': 'application/json',
    ...(token ? { Authorization: `Bearer ${token}` } : {}),
    ...options.headers,
  };
  const res = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: 'خطا در ارتباط با سرور' }));
    throw new Error(err.error || 'خطا');
  }
  return res.json();
}

  if (!isOpen) return null;

    <div style={styles.modalOverlay} onClick={onClose}>

/* ── Order Form Modal ── */
function OrderFormModal({ customer, onClose, onCreated }) {
  const [notes, setNotes] = useState('');
  const [totalAmount, setTotalAmount] = useState('');
  const [submitting, setSubmitting] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!notes.trim()) { alert('لطفاً توضیحات سفارش را وارد کنید'); return; }
    setSubmitting(true);
    try {
      const body = {
        customer_id: customer.id,
        source_app: 'wholesale-portal',
        sales_channel: 'wholesale',
        order_type: 'stock',
        note: notes.trim(),
      };
      if (totalAmount && Number(totalAmount) > 0) body.total_amount = Number(totalAmount);
      await apiCall('/crm-orders', { method: 'POST', body: JSON.stringify(body) });
      alert('سفارش با موفقیت ثبت شد');
      onClose();
      if (onCreated) onCreated();
    } catch (err) {
      alert('خطا در ثبت سفارش: ' + (err.message || ''));
    } finally { setSubmitting(false); }
  };

  return (
    <form onSubmit={handleSubmit}>
      <TextareaField
        label="توضیحات سفارش"
        required
        value={notes}
        onChange={e => setNotes(e.target.value)}
        placeholder="محصولات، تعداد، جزئیات و هرگونه توضیح لازم..."
        rows={5}
      />
      <InputField
        label="مبلغ تخمینی (ریال)"
        required={false}
        type="number"
        min="1"
        value={totalAmount}
        onChange={e => setTotalAmount(e.target.value)}
        placeholder="مثال: ۵۰۰۰۰۰۰"
      />
      <button
        type="submit"
        disabled={submitting}
        style={{ ...styles.btnPrimary, width: '100%', marginTop: D.space.md, opacity: submitting ? 0.7 : 1 }}
      >
        {submitting ? "در حال ثبت..." : "ثبت سفارش"}
      </button>
    </form>
  );
}

/* ── Payments / Invoices ── */
function InvoicesTab({ customer }) {
  const [invoices, setInvoices] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showPaymentForm, setShowPaymentForm] = useState(false);
  const [paymentAmount, setPaymentAmount] = useState('');
  const [paymentMethod, setPaymentMethod] = useState('کارت به کارت');
  const [paymentOrder, setPaymentOrder] = useState('');
  const [paymentNote, setPaymentNote] = useState('');
  const [submitting, setSubmitting] = useState(false);

  const fetchData = async () => {
    try {
      const data = await apiCall(`/crm-payments`);
      setInvoices(data || []);
    } catch (e) { console.error(e); }
  };

  useEffect(() => { (async () => { await fetchData(); setLoading(false); })(); }, [customer.id]);

  const handleSubmitPayment = async (e) => {
    e.preventDefault();
    const parsed = Number(paymentAmount);
    if (!paymentAmount || !Number.isFinite(parsed) || parsed <= 0) { alert('مبلغ معتبر وارد کنید'); return; }
    setSubmitting(true);
    try {
      const body = { amount: parsed, payment_method: paymentMethod, note: paymentNote || undefined };
      if (paymentOrder && Number(paymentOrder) > 0) body.order_id = Number(paymentOrder);
      await apiCall('/crm-payment-submit', { method: 'POST', body: JSON.stringify(body) });
      alert('پرداخت با موفقیت ثبت شد');
      setPaymentAmount(''); setPaymentMethod('کارت به کارت'); setPaymentOrder(''); setPaymentNote('');
      await fetchData();
    } catch (err) { alert('خطا: ' + (err.message || '')); } finally { setSubmitting(false); }
  };

  const statusLabel = (s) => { if (s === 'paid' || s === 'approved') return 'پرداخت شده'; if (s === 'pending') return 'در انتظار تایید'; if (s === 'rejected') return 'رد شده'; return s || '—'; };
  const statusStyle = (s) => ({ ...styles.badge, background: s === 'paid' || s === 'approved' ? D.successBg : s === 'rejected' ? D.dangerBg : D.warningBg, color: s === 'paid' || s === 'approved' ? '#065f46' : s === 'rejected' ? '#991b1b' : '#856404' });

  if (loading) return <div style={styles.tabContent}><p style={styles.loadingText}>در حال بارگذاری...</p></div>;

  return (
    <div style={styles.tabContent}>
      {/* Section Header */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: D.space.md }}>
        <h3 style={styles.sectionTitle}>پرداخت‌ها و فاکتورها</h3>
        <button onClick={() => setShowPaymentForm(true)} style={{...styles.btnPrimary, display: 'flex', alignItems: 'center', gap: D.space.xs }}>
          <IcPlus /> ثبت پرداخت جدید
        </button>
      </div>

      {/* Payment Form Card */}
      <div style={styles.sectionCard}>
        <h4 style={{ ...styles.sectionTitle, marginBottom: D.space.md }}>ثبت پرداخت جدید</h4>
        <form onSubmit={handleSubmitPayment}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: D.space.md, marginBottom: D.space.md }}>
            <InputField label="مبلغ (ریال)" required type="number" min="1" value={paymentAmount} onChange={e => setPaymentAmount(e.target.value)} placeholder="مثال: ۵۰۰۰۰۰۰" />
            <SelectField label="روش پرداخت" required value={paymentMethod} onChange={e => setPaymentMethod(e.target.value)} options={['کارت به کارت', 'واریز به حساب', 'چک', 'نقدی']} />
          </div>
          <InputField label="شماره سفارش (اختیاری)" required={false} type="number" min="1" value={paymentOrder} onChange={e => setPaymentOrder(e.target.value)} placeholder="شماره سفارش مرتبط" />
          <TextareaField label="یادداشت (اختیاری)" required={false} value={paymentNote} onChange={e => setPaymentNote(e.target.value)} placeholder="..." rows={2} />
          <button type="submit" disabled={submitting}
            style={{ ...styles.btnPrimary, width: '100%', marginTop: D.space.md, opacity: submitting ? 0.7 : 1 }}>
            {submitting ? "در حال ثبت..." : "ثبت پرداخت"}
          </button>
        </form>
      </div>

      {/* Payments List */}
      <h3 style={{...styles.sectionTitle, marginBottom: D.space.md, marginTop: D.space.xl }}>سابقه پرداخت‌ها</h3>
      {invoices.length === 0 ? (
        <EmptyState

          title="هنوز پرداختی ثبت نشده"
          description="اولین پرداخت خود را از قسمت بالا ثبت کنید."
        />
      ) : (
        invoices.map(inv => (
          <div key={inv.id} style={styles.invoiceCard}>
            <div style={styles.invoiceRow}>
              <span style={styles.invoiceId}>پرداخت #{inv.id}</span>
              <span style={styles.priceText}>{formatPrice(inv.amount)}</span>
            </div>

              <span style={styles.smallText}>{formatDate(inv.created_at)}</span>
              <Badge variant={inv.status === 'paid' || inv.status === 'approved' ? 'paid' : inv.status === 'rejected' ? 'cancelled' : 'pending'}>

function App() {
  const [tab, setTab] = useState('dashboard');
  const [customer, setCustomer] = useState(null);
  const [orders, setOrders] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    (async () => {
      try {
        const token = localStorage.getItem('az_token');
        if (!token) { setLoading(false); return; }

        const payload = decodeJwt(token);
        if (!payload || !payload.id) { localStorage.removeItem('az_token'); setLoading(false); return; }

        const profile = { id: payload.id, username: payload.username, name: payload.name || payload.username };
        setCustomer(profile);

        // Fetch full profile from CRM
        try {
          const full = await apiCall(`/crm-customers?id=${profile.id}`);
          if (full && full.length > 0) setCustomer(prev => ({ ...prev, ...full[0] }));
        } catch (_) { /* use basic profile */ }

        const orderData = await apiCall(`/crm-orders?customer_id=${profile.id}`);
        setOrders((orderData||[]).sort((a, b) => new Date(b.created_at) - new Date(a.created_at)));
      } catch (err) {
        console.error(err);
        localStorage.removeItem('az_token');
      } finally { setLoading(false); }
    })();
  }, []);

  const approveProforma = async (orderId) => {
    try {
      const res = await apiCall('/crm-proforma-approve', { method: 'POST', body: JSON.stringify({ order_id: orderId }) });
      if (res && res.ok) {
        setOrders(prev => prev.map(o => o.id === orderId ? { ...o, proforma_status: 'approved' } : o));
        alert('پیش‌فاکتور با موفقیت تایید شد');
      }
    } catch (e) { alert('خطا در تایید: ' + (e.message || '')); }
  };

  const refreshOrders = async () => {
    if (!customer) return;
    try {
      const data = await apiCall(`/crm-orders?customer_id=${customer.id}`);
      setOrders(data.sort((a, b) => new Date(b.created_at) - new Date(a.created_at)));
    } catch (err) { console.error(err); }
  };

  const logout = () => {
    localStorage.removeItem('az_token');
    setCustomer(null);
    setOrders([]);
  };

  if (!customer && !loading) {
    return (
      <div style={{ position:"fixed", inset:0, display:"flex", alignItems:"center", justifyContent:"center", background:D.bg, color:D.textDim, fontSize:D.fontSize.base, flexDirection:"column", gap:D.space.md }}>
        <p>لطفاً ابتدا وارد شوید</p>
        <button onClick={() => window.location.href = '/'}
          style={{ padding:"10px 20px", borderRadius:D.radius.md, border:"none", background:D.primary, color:"#fff", fontWeight:600, cursor:"pointer", fontFamily:FONT }}>
          ورود به پورتال
        </button>
      </div>
    );
  }

  if (loading) return <div style={styles.app}><p style={styles.loadingText}>در حال بارگذاری...</p></div>;

  return (
    <div style={styles.app}>
      {/* Top Header */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:`${D.space.md} ${D.space.md}`, background:D.surface, borderBottom:`1px solid ${D.border}` }}>
        <span style={{ fontSize:D.fontSize.base, fontWeight:D.fontWeight.bold, color:D.text }}>پورتال عمده‌فروشی</span>
        <button onClick={logout} style={{ background:"transparent", border:"none", color:D.textMuted, cursor:"pointer", fontFamily:FONT, fontSize:D.fontSize.sm, padding:`${D.space.xs} ${D.space.sm}`, borderRadius:D.radius.sm }}>
          خروج
        </button>
      </div>

      {/* Tab Content */}
      {tab === 'dashboard' && <DashboardTab customer={customer} orders={orders} />}
      {tab === 'orders' && <OrdersTab orders={orders} onApprove={approveProforma} customer={customer} onOrderCreated={refreshOrders} />}
      {tab === 'invoices' && <InvoicesTab customer={customer} />}
      {tab === 'documents' && <DocumentsTab />}
      {tab === 'chat' && <ChatTab />}
      {tab === 'profile' && <ProfileTab customer={customer} />}

      {/* Bottom Navigation */}
      <nav style={styles.tabBar}>
        {TABS.map(t => (
          <div key={t.id} onClick={() => setTab(t.id)}
            style={{...styles.tabItem, color: tab===t.id ? D.primary : D.textDim}}>
            <t.icon />
            <span style={styles.tabLabel}>{t.label}</span>
          </div>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
