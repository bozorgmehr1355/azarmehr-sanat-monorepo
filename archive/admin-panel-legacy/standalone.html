<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پنل مدیریت</title>
    <style>
        body { margin:0; background:#0d1117; color:#c9d1d9; font-family:sans-serif; }
        #root { display:flex; height:100vh; }
        nav { width:200px; background:#161b22; padding:20px; border-right:1px solid #30363d; }
        nav h3 { color:#f0f6fc; margin-bottom:20px; }
        nav button { display:block; width:100%; padding:10px; margin-bottom:4px; background:transparent; color:#fff; border:none; border-radius:6px; cursor:pointer; text-align:right; font-size:14px; }
        nav button.active { background:#d4880e; font-weight:bold; }
        nav button.danger { background:#da3633; margin-top:20px; }
        main { flex:1; padding:24px; overflow-y:auto; }
        .page { color:#c9d1d9; font-size:18px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18",
                "react-dom/client": "https://esm.sh/react-dom@18/client"
            }
        }
    </script>

    <script type="module">
        import React from 'react';
        import { createRoot } from 'react-dom/client';
        import { useState } from 'react';

        // صفحات ساده برای تست
        const pages = {
            dashboard: () => React.createElement('div', { className: 'page' }, '📊 داشبورد'),
            crm: () => React.createElement('div', { className: 'page' }, '👥 مدیریت مشتریان'),
            orders: () => React.createElement('div', { className: 'page' }, '📦 سفارشات'),
            messenger: () => React.createElement('div', { className: 'page' }, '💬 پیام‌رسان'),
            tankhah: () => React.createElement('div', { className: 'page' }, '💰 تنخواه'),
            system: () => React.createElement('div', { className: 'page' }, '⚙️ کنترل سیستم'),
        };

        function App() {
            const [tab, setTab] = useState('dashboard');

            return React.createElement('div', { style: { display: 'flex', height: '100vh', background: '#0d1117', color: '#c9d1d9' } },
                React.createElement('nav', null,
                    React.createElement('h3', null, '📊 منو'),
                    Object.keys(pages).map(key =>
                        React.createElement('button', {
                            key: key,
                            onClick: () => setTab(key),
                            className: tab === key ? 'active' : ''
                        }, key.charAt(0).toUpperCase() + key.slice(1))
                    ),
                    React.createElement('button', {
                        className: 'danger',
                        onClick: () => {
                            localStorage.removeItem('adminToken');
                            location.reload();
                        }
                    }, '🚪 خروج')
                ),
                React.createElement('main', null,
                    pages[tab] ? pages[tab]() : React.createElement('div', { className: 'page' }, 'صفحه پیدا نشد')
                )
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
